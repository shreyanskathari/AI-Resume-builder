services:
  # 1. Backend Web Service (Node.js + Express)
  - type: web
    name: careercraft-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: careercraft-frontend
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://careercraft-backend-skla.onrender.com/api

